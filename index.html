<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INSANE Store | Imagine Beyond Standard. Create Extraordinary.</title>
<meta name="description" content="Shop products from INSANE. Photos, reviews and easy ordering on WhatsApp.">
<meta property="og:title" content="INSANE Store">
<meta property="og:image" content="og.jpg">
<meta name="theme-color" content="#05070D">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="shop.css">
</head>
<body>
<div class="ann" id="ann" hidden></div>
<header>
  <div class="wrap bar">
    <a class="logo" href="./" aria-label="INSANE Store home"><img src="logo.png" alt="INSANE" width="640" height="119"></a>
    <div class="hbtns"><button class="cartbtn" id="openTrack" aria-label="Track your orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></button>
    <button class="cartbtn" id="openCart" aria-label="Open cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>
      <span class="cn" id="cn" hidden>0</span>
    </button></div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1>Shop the <span class="grad">extraordinary.</span></h1>
      <p>Imagine beyond standard. Order in a minute and confirm on WhatsApp.</p>
      <input id="q" class="search" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off">
    </div>
  </section>

  <section class="wrap shop">
    <div class="toolbar">
      <div class="cats" id="cats" role="group" aria-label="Categories"></div>
      <label class="sort">Sort <select id="sort"><option value="new">Newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="rated">Top rated</option></select></label>
    </div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <img class="flogo" src="logo.png" alt="INSANE" width="640" height="119">
    <p class="acro">Imagine &bull; Nothing &bull; Standard &bull; Achieve &bull; New &bull; Experiences</p>
    <div class="foot"><span>&copy; <span id="year"></span> INSANE. All rights reserved.</span><span><a href="features.html">Store features</a> &nbsp; <a href="admin.html">Admin</a></span></div>
  </div>
</footer>

<div class="ov" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Product details"><button class="x" id="closeM" aria-label="Close">&times;</button><div id="mbody"></div></div></div>

<div class="ov" id="trk" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Track your order"><button class="x" id="closeT" aria-label="Close">&times;</button><div id="tbody"></div></div></div>

<div class="ov" id="ov2" hidden></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart">
  <div class="dhead"><h2>Your cart</h2><button class="x" id="closeC" aria-label="Close cart">&times;</button></div>
  <div class="dbody" id="dbody"></div>
</aside>

<a class="wa-float" data-wa target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></a>
<p id="toast" role="status" hidden></p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script src="shop.js"></script>
</body>
</html>
